<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5ded2" />
    <meta name="description" content="A tiny Maltese keeping you company in a cozy little room." />
    <title>A Little Somewhere</title>
  </head>
  <body>
    <main class="app">
      <header class="title-bar">
        <div class="title-copy">
          <p class="eyebrow">A quiet little companion</p>
          <h1>A Little Somewhere</h1>
        </div>
        <div class="header-controls">
          <button
            class="room-control-button hint-replay-button"
            type="button"
            aria-label="Replay interaction hints"
            title="Replay hints"
            data-hint-replay
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M9.5 13.5V4.8a1.7 1.7 0 0 1 3.4 0v7.1m0-1a1.6 1.6 0 0 1 3.1.2m0 .3a1.6 1.6 0 0 1 3.1.3v3.8c0 3.4-2.3 5.5-5.7 5.5h-2.1c-1.5 0-2.5-.5-3.4-1.6l-3-4a1.6 1.6 0 0 1 2.3-2.2l2.3 2.2" />
              <path d="M4.3 7.3 3 6m2-2.2-.3-1.7m2.9 2.1 1.1-1.4" />
            </svg>
          </button>
          <button
            class="room-control-button photo-control-button"
            type="button"
            aria-label="Open Jimmy photos"
            aria-haspopup="dialog"
            data-photo-toggle
            hidden
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2.5" />
              <circle cx="8.5" cy="9.5" r="1.5" />
              <path d="m4 17 5.2-5 3.2 3 2.5-2.4L20 17" />
            </svg>
          </button>
          <div class="room-controls" data-scene-controls>
            <button
            class="room-control-button"
            type="button"
            aria-label="Choose room"
            aria-controls="scene-picker"
            aria-expanded="false"
            aria-haspopup="menu"
            data-scene-toggle
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3.5 11.2 12 4l8.5 7.2v8.3a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z" />
              <path d="M9.2 20.5v-6.2h5.6v6.2" />
            </svg>
            </button>
            <div class="scene-picker" id="scene-picker" role="menu" data-scene-menu hidden>
            <p class="scene-picker-title">Choose a little room</p>
            <button type="button" role="menuitemradio" data-scene-id="wood">
              <span class="scene-swatch scene-swatch-wood" aria-hidden="true"></span>
              <span>Cozy Wood Room</span>
              <span class="scene-check" aria-hidden="true">✓</span>
            </button>
            <button type="button" role="menuitemradio" data-scene-id="creamTile">
              <span class="scene-swatch scene-swatch-tile" aria-hidden="true"></span>
              <span>Warm Tile Room</span>
              <span class="scene-check" aria-hidden="true">✓</span>
            </button>
            </div>
          </div>
        </div>
      </header>
      <section class="room-frame" aria-label="Virtual pet room">
        <p class="pet-status" role="status" aria-live="polite" data-pet-status></p>
        <canvas
          id="room"
          role="img"
          aria-label="A tiny white Maltese in a cozy illustrated room. Tap the dog for attention, the floor to call it over, or the wall to make it look around."
        ></canvas>
      </section>
    </main>
    <dialog class="jimmy-photo-dialog" aria-labelledby="jimmy-photo-heading" data-photo-dialog>
      <button class="jimmy-photo-close" type="button" aria-label="Close photos" data-photo-close>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18" /></svg>
      </button>
      <div class="jimmy-photo-scroll" data-photo-list>
        <div class="jimmy-photo-heading">
          <p class="jimmy-photo-eyebrow">A Little Friend</p>
          <h2 id="jimmy-photo-heading">Maltese</h2>
          <p class="jimmy-photo-subtitle">馬爾濟斯</p>
        </div>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
